name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for git describe version

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build all binaries
        run: make all

      - name: Vet
        run: go vet ./...

      - name: Run unit tests
        run: make test

      - name: Verify version is set
        run: ./bin/ovm version

      - name: Verify MCP handshake
        run: |
          echo '{"jsonrpc":"2.0","method":"initialize","params":{"capabilities":{}},"id":1}' \
            | ./bin/ovm-mcp \
            | python3 -c "import sys,json; r=json.load(sys.stdin)['result']; assert r['serverInfo']['name']=='omnivm', 'bad name'; assert 'tools' in r['capabilities'], 'no tools'; print('MCP handshake OK')"
