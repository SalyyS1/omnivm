name: Integration (KVM)

# Boots real microVMs. GitHub-hosted Linux runners expose /dev/kvm; the job
# fails loudly (instead of skipping) when KVM is unavailable.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run:
        description: "go test -run pattern (empty = all tests)"
        required: false
        default: ""
      count:
        description: "go test -count (repeat to chase flaky tests)"
        required: false
        default: "1"

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Require KVM
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is not available on this runner; integration tests need KVM"
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          grep -m1 'model name' /proc/cpuinfo; uname -r

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y virtiofsd e2fsprogs iptables iproute2

      - name: Build binaries, Cloud Hypervisor and kernel
        run: |
          make all cloud-hypervisor
          sudo make kernel HOME=/root
          ./bin/cloud-hypervisor --version

      - name: Doctor
        run: sudo HOME=/root ./bin/ovm doctor

      - name: Integration tests (short)
        env:
          RUN: ${{ inputs.run }}
          COUNT: ${{ inputs.count }}
        run: |
          sudo env "PATH=$PATH" HOME=/root GOCACHE="$(go env GOCACHE)" GOMODCACHE="$(go env GOMODCACHE)" \
            go test -tags integration -v -count="${COUNT:-1}" -short -timeout 30m ${RUN:+-run "$RUN"} ./test/integration/

      - name: Daemon log on failure
        if: failure()
        run: sudo find /root/.omnivm -name '*.log' -maxdepth 3 -exec tail -n 200 {} + || true

  benchmark:
    # Baseline lifecycle numbers on a GitHub-hosted runner. Shared, nested-
    # virtualization hardware: use the numbers for regressions, not marketing.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Prepare KVM host
        run: |
          test -e /dev/kvm || { echo "::error::/dev/kvm missing"; exit 1; }
          sudo apt-get update
          sudo apt-get install -y virtiofsd e2fsprogs iptables iproute2
          make all cloud-hypervisor
          sudo make kernel HOME=/root
          sudo install -m 0755 bin/cloud-hypervisor /usr/local/bin/cloud-hypervisor

      - name: Start ovmd
        run: |
          sudo HOME=/root nohup ./bin/ovmd > /tmp/ovmd.log 2>&1 &
          for i in $(seq 1 50); do sudo test -S /root/.omnivm/ovmd.sock && exit 0; sleep 0.2; done
          cat /tmp/ovmd.log; exit 1

      - name: Lifecycle latency and RSS
        shell: bash -eo pipefail {0}
        run: |
          sudo python3 scripts/bench/lifecycle-latency.py \
            --socket /root/.omnivm/ovmd.sock --runs 20 --vms 5 \
            --json bench-results.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            bench-results.json
            /tmp/ovmd.log
