name: Integration (KVM)

# Boots real microVMs. GitHub-hosted Linux runners expose /dev/kvm; the job
# fails loudly (instead of skipping) when KVM is unavailable.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Require KVM
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is not available on this runner; integration tests need KVM"
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          grep -E -c '(vmx|svm)' /proc/cpuinfo || true

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y virtiofsd e2fsprogs iptables iproute2

      - name: Build binaries, Cloud Hypervisor and kernel
        run: |
          make all cloud-hypervisor
          sudo make kernel HOME=/root
          ./bin/cloud-hypervisor --version

      - name: Doctor
        run: sudo HOME=/root ./bin/ovm doctor

      - name: Integration tests (short)
        run: |
          sudo env "PATH=$PATH" HOME=/root GOCACHE="$(go env GOCACHE)" GOMODCACHE="$(go env GOMODCACHE)" \
            go test -tags integration -v -count=1 -short -timeout 30m ./test/integration/

      - name: Daemon log on failure
        if: failure()
        run: sudo find /root/.omnivm -name '*.log' -maxdepth 3 -exec tail -n 200 {} + || true
